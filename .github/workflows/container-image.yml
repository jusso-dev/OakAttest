name: Container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: oakattest-container-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oakattest:main
            ghcr.io/${{ github.repository_owner }}/oakattest:${{ github.sha }}

      - name: Deploy image through Coolify
        if: vars.DEPLOY_WEBHOOK != ''
        env:
          DEPLOY_WEBHOOK: ${{ vars.DEPLOY_WEBHOOK }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}" \
            "${DEPLOY_WEBHOOK}"
