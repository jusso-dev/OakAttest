name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oakattest-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted]
    timeout-minutes: 30
    env:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Docker CLI
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            /usr/bin/docker \
            /usr/local/bin/docker \
            /opt/homebrew/bin/docker \
            "$HOME/.orbstack/bin/docker" \
            /Applications/Docker.app/Contents/Resources/bin/docker; do
            if [ -x "$candidate" ]; then
              echo "${candidate%/docker}" >> "$GITHUB_PATH"
              export PATH="${candidate%/docker}:$PATH"
              echo "docker binary: ${candidate}"
              which docker
              docker info
              exit 0
            fi
          done
          echo "::error::Docker is not installed for the self-hosted runner user."
          echo "PATH=${PATH}"
          which docker || true
          exit 1

      - name: Start isolated PostgreSQL
        run: |
          set -euo pipefail
          echo "docker binary: $(which docker)"
          docker info
          name="oakattest-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
          echo "PG_CONTAINER=${name}" >> "$GITHUB_ENV"
          docker rm -f "${name}" >/dev/null 2>&1 || true
          docker run -d --name "${name}" \
            -e POSTGRES_USER=oakattest_ci \
            -e POSTGRES_PASSWORD=oakattest_ci \
            -e POSTGRES_DB=oakattest_ci \
            -p 0:5432 \
            postgres:16-alpine
          port="$(docker port "${name}" 5432/tcp | head -n1 | sed 's/.*://')"
          echo "DATABASE_URL=postgresql://oakattest_ci:oakattest_ci@127.0.0.1:${port}/oakattest_ci" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if docker exec "${name}" pg_isready -U oakattest_ci -d oakattest_ci >/dev/null 2>&1; then
              echo "postgres ready on ${port}"
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready"
          docker logs "${name}"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Validate migration journal
        run: npx drizzle-kit check

      - name: Apply migrations from zero
        run: npm run db:migrate

      - name: Seed framework registry
        run: npm run db:seed:frameworks

      - name: Production build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: ghcr.io/yumaitau/oakattest:pr-${{ github.event.pull_request.number || github.run_id }}

      - name: Stop isolated PostgreSQL
        if: always()
        run: docker rm -f "${PG_CONTAINER}" >/dev/null 2>&1 || true
